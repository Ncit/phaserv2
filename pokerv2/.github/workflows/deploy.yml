name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install dependencies (if needed)
      run: |
        if [ -f "package.json" ]; then
          npm install
        fi
        
    - name: Copy src to root for deployment
      run: |
        # Create a completely clean deployment directory
        rm -rf deploy
        mkdir -p deploy
        
        # Copy only the game files (not documentation or other files)
        cp -r src/* deploy/
        cp -r dependencies deploy/
        cp -r assets deploy/
        cp index.html deploy/
        if [ -d "supabase" ]; then cp -r supabase deploy/; fi
        if [ -f "project.config" ]; then cp project.config deploy/; fi
        
        # Create .nojekyll file in deployment root
        touch deploy/.nojekyll
        
        # Create a minimal _config.yml that completely disables Jekyll
        cat > deploy/_config.yml << 'EOF'
# Completely disable Jekyll processing
plugins: []
markdown: raw
theme: null
include: []
exclude: ["*"]
safe: false
EOF
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deploy
        force_orphan: true 