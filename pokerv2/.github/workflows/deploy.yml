name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install dependencies (if needed)
      run: |
        if [ -f "package.json" ]; then
          npm install
        fi
        
    - name: Copy src to root for deployment
      run: |
        # Create a clean deployment directory
        mkdir -p deploy
        # Copy src contents to deploy directory
        cp -r src/* deploy/
        # Copy dependencies
        cp -r dependencies deploy/
        # Copy assets
        cp -r assets deploy/
        # Copy main index.html
        cp index.html deploy/
        # Copy any other necessary files
        cp -r supabase deploy/ 2>/dev/null || true
        # Copy .nojekyll to prevent Jekyll processing
        cp .nojekyll deploy/
        # Copy Jekyll config to disable processing
        if [ -f "_config.yml" ]; then cp _config.yml deploy/; fi
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deploy
        force_orphan: true 