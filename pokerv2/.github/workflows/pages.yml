name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Create deployment directory
        run: |
          mkdir -p deploy
          
      - name: Copy source files
        run: |
          # Create a completely clean deployment directory
          rm -rf deploy
          mkdir -p deploy
          
          # Copy only the game files (not documentation or other files)
          cp -r src/* deploy/
          cp -r dependencies deploy/
          cp -r assets deploy/
          cp index.html deploy/
          if [ -d "supabase" ]; then cp -r supabase deploy/; fi
          if [ -f "project.config" ]; then cp project.config deploy/; fi
          
          # Create .nojekyll file in deployment root
          touch deploy/.nojekyll
          
          # Create a minimal _config.yml that completely disables Jekyll
          cat > deploy/_config.yml << 'EOF'
# Completely disable Jekyll processing
plugins: []
markdown: raw
theme: null
include: []
exclude: ["*"]
safe: false
EOF
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 