<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>pokerv2</title>
        <!-- PF Din Text Comp Pro Font -->
        <link rel="stylesheet" href="./assets/fonts/fonts.css">
        <style>
            /* Reset CSS: Please avoid making changes here unless you know what you're doing :) */
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
    
            html, body {
                width: 100%;
                height: 100%;
            }
    
            body {
                line-height: 1;
                font-family: var(--font-primary);
                background-color: #040218;
            }
    
            ol, ul {
                list-style: none;
            }
    
            img, video {
                max-width: 100%;
                height: auto;
                display: block;
            }
    
            a {
                text-decoration: none;
                color: inherit;
            }

            /* Desktop screens (macOS, Windows, etc.) */
            @media screen and (min-width: 1280px) {
                body {
                    transform: rotate(0deg) !important; /* No rotation needed for desktop */
                    width: 100vw !important;
                    height: 100vh !important;
                    min-height: 720px !important; /* Minimum height for proper game display */
                    overflow: hidden !important;
                }
                
                #game-container {
                    width: 100vw !important;
                    height: 100vh !important;
                    min-height: 720px !important; /* Minimum height for proper game display */
                }
            }

            /* Telegram Mini App in macOS native client - force landscape */
            @media screen and (min-width: 1280px) and (max-height: 800px) {
                body {
                    transform: rotate(90deg) !important; /* Force landscape for Telegram Mini App */
                    transform-origin: center center !important;
                    width: 100vh !important;
                    height: 100vw !important;
                    min-height: 720px !important;
                    overflow: hidden !important;
                }
                
                #game-container {
                    width: 100vh !important;
                    height: 100vw !important;
                    min-height: 720px !important;
                    transform: rotate(-90deg) !important; /* Counter-rotate content */
                    transform-origin: center center !important;
                }
            }

            /* Telegram Mini App detection and landscape forcing */
            @supports (-webkit-app-region: drag) {
                /* macOS native app detection */
                body {
                    -webkit-app-region: no-drag !important;
                }
            }

            /* Force landscape for Telegram WebApp on desktop */
            @media screen and (min-width: 1280px) {
                body.telegram-webapp {
                    transform: rotate(90deg) !important;
                    transform-origin: center center !important;
                    width: 100vh !important;
                    height: 100vw !important;
                }
                
                body.telegram-webapp #game-container {
                    transform: rotate(-90deg) !important;
                    transform-origin: center center !important;
                    width: 100vh !important;
                    height: 100vw !important;
                }
            }
        </style>
    </head>
    <body>
        <div id="game-container"></div>
    <script type="module" src="./dependencies/vkbridge.js"></script>
    <script type="module" src="./src/scripts/vklogic.js"></script>
    <script src="./dependencies/phaser.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js?58"></script>
    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module" src="./src/main.js"></script>
        <!-- Slick Carousel CSS -->
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
<!-- Slick Carousel Theme CSS (optional) -->
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>

<!-- jQuery (required for Slick) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Slick Carousel JS -->
<script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    </body>
    </html>
