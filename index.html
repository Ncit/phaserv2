<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="orientation" content="landscape">
        <title>pokerv2</title>
        <!-- PF Din Text Comp Pro Font -->
        <link rel="stylesheet" href="./assets/fonts/fonts.css">
        <style>
            /* Reset CSS: Please avoid making changes here unless you know what you're doing :) */
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
    
            html, body {
                width: 100%;
                height: 100%;
            }
    
            body {
                line-height: 1;
                font-family: var(--font-primary);
                background-color: #040218;
                /* Force landscape orientation */
                min-height: 100vh;
                min-width: 100vw;
                overflow: hidden;
            }

            /* Landscape orientation styles */
            @media screen and (orientation: portrait) {
                body {
                    transform: rotate(90deg);
                    transform-origin: left top;
                    width: 100vh;
                    height: 100vw;
                    overflow-x: hidden;
                    position: absolute;
                    top: 100%;
                    left: 0;
                }
            }
            
            @media screen and (orientation: landscape) {
                body {
                    transform: none;
                    width: 100vw;
                    height: 100vh;
                }
            }
            
            #game-container {
                width: 100vw !important;
                height: 100vh !important;
                max-width: none !important;
                max-height: none !important;
                position: relative;
                overflow: hidden;
            }
            
            canvas {
                width: 100% !important;
                height: 100% !important;
                object-fit: contain;
                display: block;
            }
    
            ol, ul {
                list-style: none;
            }
    
            img, video {
                max-width: 100%;
                height: auto;
                display: block;
            }
    
            a {
                text-decoration: none;
                color: inherit;
            }
        </style>
    </head>
    <body>
        <div id="game-container"></div>
    <script type="module" src="./dependencies/vkbridge.js"></script>
    <script type="module" src="./src/scripts/vklogic.js"></script>
    <script src="./dependencies/phaser.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js?58"></script>
    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module" src="./src/main.js"></script>
        <!-- Slick Carousel CSS -->
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
<!-- Slick Carousel Theme CSS (optional) -->
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>

<!-- jQuery (required for Slick) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Slick Carousel JS -->
<script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    </body>
    </html>
