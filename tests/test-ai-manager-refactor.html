<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Manager Refactor Test</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 5px;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 3px;
        }
        .success {
            background-color: #2d5a2d;
            border: 1px solid #4a7c4a;
        }
        .error {
            background-color: #5a2d2d;
            border: 1px solid #7c4a4a;
        }
        .info {
            background-color: #2d2d5a;
            border: 1px solid #4a4a7c;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🤖 AI Manager Refactor Test</h1>
        <p>Testing the refactored AI logic moved to AIManager class</p>
        
        <div class="test-section">
            <h2>🧪 Test Results</h2>
            <div id="test-results"></div>
        </div>
    </div>

    <script type="module">
        // Import the AIManager class
        import { AIManager } from '../src/managers/AIManager.js';

        // Test results container
        const testResults = document.getElementById('test-results');

        function addTestResult(message, type = 'info') {
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${type}`;
            resultDiv.textContent = message;
            testResults.appendChild(resultDiv);
        }

        // Test function
        function runTests() {
            addTestResult('🚀 Starting AI Manager tests...', 'info');

            try {
                // Test 1: Create AIManager instance
                const aiManager = new AIManager();
                addTestResult('✅ AIManager instance created successfully', 'success');

                // Test 2: Test personality icon methods
                const tightIcon = aiManager.getPersonalityIcon('tight_aggressive');
                const looseIcon = aiManager.getPersonalityIcon('loose_passive');
                const manicIcon = aiManager.getPersonalityIcon('manic_bluffer');
                const rockIcon = aiManager.getPersonalityIcon('solid_rock');

                if (tightIcon === '🎯' && looseIcon === '🐟' && manicIcon === '🎭' && rockIcon === '🪨') {
                    addTestResult('✅ Personality icons working correctly', 'success');
                } else {
                    addTestResult('❌ Personality icons not working correctly', 'error');
                }

                // Test 3: Test personality colors
                const tightColor = aiManager.getPersonalityColor('tight_aggressive');
                const looseColor = aiManager.getPersonalityColor('loose_passive');
                const manicColor = aiManager.getPersonalityColor('manic_bluffer');
                const rockColor = aiManager.getPersonalityColor('solid_rock');

                if (tightColor === 0x00ff00 && looseColor === 0x00ffff && 
                    manicColor === 0xff00ff && rockColor === 0xffff00) {
                    addTestResult('✅ Personality colors working correctly', 'success');
                } else {
                    addTestResult('❌ Personality colors not working correctly', 'error');
                }

                // Test 4: Test thinking time calculation
                const testPlayer = {
                    personality: {
                        patience: 0.5
                    }
                };
                const thinkingTime = aiManager.calculateThinkingTime(testPlayer);
                if (thinkingTime >= 300 && thinkingTime <= 2000) {
                    addTestResult('✅ Thinking time calculation working correctly', 'success');
                } else {
                    addTestResult('❌ Thinking time calculation not working correctly', 'error');
                }

                // Test 5: Test player position calculation
                const gameState = {
                    dealerPosition: 0,
                    players: [{}, {}, {}, {}, {}]
                };
                const position = aiManager.getPlayerPosition(2, gameState);
                if (position === 2) {
                    addTestResult('✅ Player position calculation working correctly', 'success');
                } else {
                    addTestResult('❌ Player position calculation not working correctly', 'error');
                }

                // Test 6: Test AI decision calculation
                const aiPlayer = {
                    name: 'Test AI',
                    aiLevel: 'tight_aggressive',
                    personality: {
                        aggression: 0.8,
                        looseness: 0.2,
                        bluffFrequency: 0.1,
                        patience: 0.9,
                        riskTolerance: 0.6
                    },
                    hand: [
                        { value: 'ace', suit: 'hearts' },
                        { value: 'king', suit: 'hearts' }
                    ],
                    currentBet: 0,
                    bank: 1000
                };

                const testGameState = {
                    currentBet: 20,
                    pot: 60,
                    dealerPosition: 0,
                    players: [aiPlayer],
                    communityCards: [],
                    bigBlind: 20
                };

                const decision = aiManager.calculateAIDecision(aiPlayer, testGameState);
                if (decision && decision.action && typeof decision.amount === 'number') {
                    addTestResult('✅ AI decision calculation working correctly', 'success');
                    addTestResult(`📊 AI Decision: ${decision.action} $${decision.amount}`, 'info');
                } else {
                    addTestResult('❌ AI decision calculation not working correctly', 'error');
                }

                addTestResult('🎉 All tests completed successfully!', 'success');
                addTestResult('✅ AI Manager refactoring is working correctly', 'success');

            } catch (error) {
                addTestResult(`❌ Test failed with error: ${error.message}`, 'error');
                console.error('Test error:', error);
            }
        }

        // Run tests when page loads
        window.addEventListener('load', runTests);
    </script>
</body>
</html>
